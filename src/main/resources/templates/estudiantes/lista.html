<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/nav :: cabecera('Estudiantes')}"></head>
<body>
<div th:replace="~{fragments/nav :: menu('estudiantes')}"></div>
<div class="container pb-5">
    <div th:replace="~{fragments/nav :: mensajes}"></div>
    <div class="tarjeta">
        <div class="tarjeta-encabezado">
            <h2><i class="bi bi-people-fill me-2"></i>Estudiantes</h2>
            <a class="btn btn-principal" th:href="@{/estudiantes/nuevo}">
                <i class="bi bi-plus-lg me-1"></i>Registrar estudiante</a>
        </div>
        <div class="table-responsive">
            <table class="table tabla">
                <thead>
                <tr><th>Estudiante</th><th>Documento</th><th>Correo</th><th>Teléfono</th><th>Acciones</th></tr>
                </thead>
                <tbody>
                <tr th:each="e : ${estudiantes}">
                    <td>
                        <span class="avatar" th:text="${#strings.substring(e.nombres,0,1) + #strings.substring(e.apellidos,0,1)}"></span>
                        <span class="fw-semibold" th:text="${e.nombres + ' ' + e.apellidos}"></span>
                    </td>
                    <td th:text="${e.documento}"></td>
                    <td th:text="${e.correo}"></td>
                    <td th:text="${e.telefono}"></td>
                    <td>
                        <div class="acciones">
                            <a class="btn btn-sm btn-outline-info btn-icono" title="Ver"
                               th:href="@{/estudiantes/{id}(id=${e.id})}"><i class="bi bi-eye"></i></a>
                            <a class="btn btn-sm btn-outline-warning btn-icono" title="Editar"
                               th:href="@{/estudiantes/{id}/editar(id=${e.id})}"><i class="bi bi-pencil"></i></a>
                            <form method="post" th:action="@{/estudiantes/{id}/eliminar(id=${e.id})}"
                                  onsubmit="return confirm('¿Eliminar este estudiante?');">
                                <button class="btn btn-sm btn-outline-danger btn-icono" title="Eliminar" type="submit">
                                    <i class="bi bi-trash"></i></button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(estudiantes)}">
                    <td colspan="5" class="text-center text-muted py-4">
                        <i class="bi bi-inbox fs-3 d-block"></i>No hay estudiantes registrados</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
