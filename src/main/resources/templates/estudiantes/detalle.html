<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Detalle del estudiante</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: menu}"></div>
<div class="container">
  <h2>Detalle del estudiante</h2>
  <dl class="row">
    <dt class="col-sm-3">Documento</dt><dd class="col-sm-9" th:text="${estudiante.documento}"></dd>
    <dt class="col-sm-3">Nombre</dt><dd class="col-sm-9" th:text="${estudiante.nombres + ' ' + estudiante.apellidos}"></dd>
    <dt class="col-sm-3">Correo</dt><dd class="col-sm-9" th:text="${estudiante.correo}"></dd>
    <dt class="col-sm-3">Teléfono</dt><dd class="col-sm-9" th:text="${estudiante.telefono}"></dd>
  </dl>

  <h4>Matrículas del estudiante</h4>
  <table class="table table-sm">
    <thead><tr><th>Programa</th><th>Periodo</th><th>Semestre</th><th>Estado</th><th>Valor</th></tr></thead>
    <tbody>
    <tr th:each="m : ${estudiante.matriculas}">
      <td th:text="${m.programa}"></td>
      <td th:text="${m.periodo}"></td>
      <td th:text="${m.semestre}"></td>
      <td th:text="${m.estado}"></td>
      <td th:text="${m.valor}"></td>
    </tr>
    <tr th:if="${#lists.isEmpty(estudiante.matriculas)}">
      <td colspan="5" class="text-muted">Sin matrículas registradas</td>
    </tr>
    </tbody>
  </table>
  <a class="btn btn-secondary" th:href="@{/estudiantes}">Volver</a>
</div>
</body>
</html>
