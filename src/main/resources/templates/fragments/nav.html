<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="cabecera(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' | MatriculaFácil'">MatriculaFácil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/estilo.css}" rel="stylesheet">
</head>
<body>
<nav th:fragment="menu(activo)" class="navbar navbar-expand barra mb-4">
    <div class="container">
        <a class="navbar-brand text-white" th:href="@{/}">
            <i class="bi bi-mortarboard-fill me-2"></i>MatriculaFácil
        </a>
        <div class="navbar-nav">
            <a class="nav-link" th:classappend="${activo == 'estudiantes'} ? 'active'" th:href="@{/estudiantes}">
                <i class="bi bi-people me-1"></i>Estudiantes</a>
            <a class="nav-link" th:classappend="${activo == 'matriculas'} ? 'active'" th:href="@{/matriculas}">
                <i class="bi bi-journal-check me-1"></i>Matrículas</a>
        </div>
    </div>
</nav>

<div th:fragment="mensajes">
    <div th:if="${exito}" class="alert alert-success">
        <i class="bi bi-check-circle-fill"></i><span th:text="${exito}"></span>
    </div>
    <div th:if="${error}" class="alert alert-danger">
        <i class="bi bi-exclamation-triangle-fill"></i><span th:text="${error}"></span>
    </div>
</div>
</body>
</html>
