<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Matrículas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: menu}"></div>
<div class="container">
  <div class="d-flex justify-content-between mb-3">
    <h2>Matrículas</h2>
    <a class="btn btn-primary" th:href="@{/matriculas/nuevo}">Registrar matrícula</a>
  </div>
  <div th:replace="~{fragments/nav :: mensajes}"></div>

  <table class="table table-striped align-middle">
    <thead>
    <tr><th>Estudiante</th><th>Programa</th><th>Periodo</th><th>Sem.</th><th>Fecha</th><th>Estado</th><th>Valor</th><th>Acciones</th></tr>
    </thead>
    <tbody>
    <tr th:each="m : ${matriculas}">
      <td th:text="${m.estudiante.nombres + ' ' + m.estudiante.apellidos}"></td>
      <td th:text="${m.programa}"></td>
      <td th:text="${m.periodo}"></td>
      <td th:text="${m.semestre}"></td>
      <td th:text="${m.fechaMatricula}"></td>
      <td><span class="badge"
                th:classappend="${m.estado == 'APROBADA'} ? 'bg-success' : (${m.estado == 'RECHAZADA'} ? 'bg-danger' : 'bg-warning text-dark')"
                th:text="${m.estado}"></span></td>
      <td th:text="${m.valor}"></td>
      <td>
        <a class="btn btn-sm btn-info" th:href="@{/matriculas/{id}(id=${m.id})}">Ver</a>
        <a class="btn btn-sm btn-warning" th:href="@{/matriculas/{id}/editar(id=${m.id})}">Editar</a>
        <form class="d-inline" method="post" th:action="@{/matriculas/{id}/aprobar(id=${m.id})}">
          <button class="btn btn-sm btn-success" type="submit">Aprobar</button>
        </form>
        <form class="d-inline" method="post" th:action="@{/matriculas/{id}/rechazar(id=${m.id})}">
          <button class="btn btn-sm btn-secondary" type="submit">Rechazar</button>
        </form>
        <form class="d-inline" method="post" th:action="@{/matriculas/{id}/eliminar(id=${m.id})}"
              onsubmit="return confirm('¿Eliminar esta matrícula?');">
          <button class="btn btn-sm btn-danger" type="submit">Eliminar</button>
        </form>
      </td>
    </tr>
    <tr th:if="${#lists.isEmpty(matriculas)}">
      <td colspan="8" class="text-center text-muted">No hay matrículas registradas</td>
    </tr>
    </tbody>
  </table>
</div>
</body>
</html>
