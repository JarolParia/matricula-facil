<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Matrícula</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: menu}"></div>
<div class="container" style="max-width: 600px;">
  <h2 th:text="${titulo}"></h2>
  <form method="post" th:action="@{/matriculas/guardar}" th:object="${matricula}">
    <input type="hidden" th:field="*{id}">

    <div class="mb-3">
      <label class="form-label">Estudiante</label>
      <select class="form-select" th:field="*{estudiante.id}"
              th:classappend="${#fields.hasErrors('estudiante')} ? 'is-invalid'">
        <option value="">-- Seleccione --</option>
        <option th:each="e : ${estudiantes}" th:value="${e.id}"
                th:text="${e.documento + ' - ' + e.nombres + ' ' + e.apellidos}"></option>
      </select>
      <div class="invalid-feedback" th:errors="*{estudiante}"></div>
    </div>
    <div class="mb-3">
      <label class="form-label">Programa</label>
      <select class="form-select" th:field="*{programa}"
              th:classappend="${#fields.hasErrors('programa')} ? 'is-invalid'">
        <option value="">-- Seleccione --</option>
        <option>Ingeniería de Sistemas</option>
        <option>Ingeniería de Software</option>
        <option>Ingeniería Industrial</option>
        <option>Administración de Empresas</option>
        <option>Contaduría Pública</option>
        <option>Derecho</option>
        <option>Psicología</option>
      </select>
      <div class="invalid-feedback" th:errors="*{programa}"></div>
    </div>
    <div class="mb-3">
      <label class="form-label">Periodo (ej. 2026-2)</label>
      <input type="text" class="form-control" th:field="*{periodo}"
             th:classappend="${#fields.hasErrors('periodo')} ? 'is-invalid'">
      <div class="invalid-feedback" th:errors="*{periodo}"></div>
    </div>
    <div class="mb-3">
      <label class="form-label">Semestre (1 a 10)</label>
      <input type="number" class="form-control" th:field="*{semestre}"
             th:classappend="${#fields.hasErrors('semestre')} ? 'is-invalid'">
      <div class="invalid-feedback" th:errors="*{semestre}"></div>
    </div>
    <div class="mb-3">
      <label class="form-label">Fecha de matrícula</label>
      <input type="date" class="form-control" th:field="*{fechaMatricula}"
             th:classappend="${#fields.hasErrors('fechaMatricula')} ? 'is-invalid'">
      <div class="invalid-feedback" th:errors="*{fechaMatricula}"></div>
    </div>
    <div class="mb-3">
      <label class="form-label">Estado</label>
      <select class="form-select" th:field="*{estado}">
        <option value="PENDIENTE">PENDIENTE</option>
        <option value="APROBADA">APROBADA</option>
        <option value="RECHAZADA">RECHAZADA</option>
      </select>
      <div class="text-danger" th:errors="*{estado}"></div>
    </div>
    <div class="mb-3">
      <label class="form-label">Valor</label>
      <input type="number" step="0.01" class="form-control" th:field="*{valor}"
             th:classappend="${#fields.hasErrors('valor')} ? 'is-invalid'">
      <div class="invalid-feedback" th:errors="*{valor}"></div>
    </div>

    <button class="btn btn-primary" type="submit">Guardar</button>
    <a class="btn btn-secondary" th:href="@{/matriculas}">Cancelar</a>
  </form>
</div>
</body>
</html>
